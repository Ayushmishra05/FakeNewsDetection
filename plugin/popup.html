<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detection</title>
  <style>
    /* Overall page styling */
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #121212; /* Black background */
      color: white; /* White text color */
      padding: 20px;
      width: 350px; /* Increased width */
      height: auto;
      margin: 0;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h3 {
      color: #fff;
      text-align: center;
      font-size: 1.5em;
      margin-bottom: 20px;
    }

    /* Styling for the displayed news text */
    #newsText {
      font-size: 1.1em;
      color: #ccc;
      margin-bottom: 15px;
      word-wrap: break-word;
      word-break: break-word;
    }

    /* Container for the result message */
    .message {
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      font-size: 1.2em;
      font-weight: bold;
    }

    /* Fake news styling */
    .fake {
      background-color: #ffebee;
      color: #d32f2f;
      border: 2px solid #d32f2f;
    }

    /* Genuine news styling */
    .genuine {
      background-color: #e8f5e9;
      color: #388e3c;
      border: 2px solid #388e3c;
    }

    /* Error message styling */
    .error {
      background-color: #fff3e0;
      color: #f57c00;
      border: 2px solid #f57c00;
    }

    /* Optional: Button style for any future additions */
    .btn {
      display: block;
      width: 100%;
      background-color: #3f51b5;
      color: #fff;
      padding: 10px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      font-size: 1.1em;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background-color: #303f9f;
    }

    /* Flex container to center the content */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h3>Fake News Detection</h3>
      <p id="newsText"></p>
      <div id="resultMessage" class="message"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
